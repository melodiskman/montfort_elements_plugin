services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./apex-solutions:/app
      - apex_node_modules:/app/node_modules
    environment:
      # Vite >= 6.1 appends this to allowedHosts so the rotating sandbox preview host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 150s
    restart: on-failure

volumes:
  apex_node_modules:
