services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: montfort_root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: montfort_wp
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmontfort_root"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

  wordpress:
    build:
      context: ./.base44
      dockerfile: Dockerfile.wordpress
    ports:
      - "3000:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: montfort_wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX:-}
    volumes:
      - wp_data:/var/www/html
      - ./montfort-elementor-widgets:/var/www/html/wp-content/plugins/montfort-elements
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/.montfort_setup_done && curl -sf -o /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: on-failure

volumes:
  db_data:
  wp_data:
